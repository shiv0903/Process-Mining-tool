@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --canvas:#E9EDF1; --panel:#FFFFFF; --panel2:#F3F6F8; --ink:#14202B; --ink2:#4A5A67;
  --muted:#8496A3; --line:#DCE3E9; --grid:#E4EAEF;
  --accent:#10707A; --accent-ink:#0A4A52; --accent-soft:#E2F0F1;
  --good:#2E7D5B; --warn:#C08421; --bad:#C34438;
  --good-soft:#E3F0EA; --warn-soft:#F6EBD6; --bad-soft:#F6E1DF;
}
*{box-sizing:border-box}
.cad{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--canvas);
  min-height:100%;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* control-band signature: a thin double rule */
.band{border-top:1px solid var(--ink);box-shadow:0 3px 0 -2px var(--accent);height:1px;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
  padding:9px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{color:var(--accent-ink);background:var(--panel2)}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
select,input[type=text]{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);color:var(--ink)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.sechead h3{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:0;letter-spacing:.01em}
@media (max-width:900px){.dash-2{grid-template-columns:1fr !important}.dash-3{grid-template-columns:1fr !important}
  .kpi-strip{grid-template-columns:repeat(2,1fr) !important}}
@media print{.btn{display:none !important}}
